services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_assistant_app
    restart: always
    ports:
      - "80:8000"
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://assistant:assistant@postgres:5432/assistant
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO_ALLOWLIST=${GITHUB_REPO_ALLOWLIST}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-mcp-assistant}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - SESSION_SECRET=${SESSION_SECRET:-supersecretkeyforproductioncookiesigning123456}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mcp_internal

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mcp_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mcp_internal

  redis:
    image: redis:7-alpine
    container_name: mcp_redis_prod
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mcp_internal

volumes:
  postgres_prod_data:

networks:
  mcp_internal:
    driver: bridge
